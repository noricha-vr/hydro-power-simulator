# PR ごとに依存を入れてビルドし、既存の型チェック（svelte-check）を流す
# --legacy-peer-deps: 今の lockfile は svelte 5 と svelte-chartjs 3（peer が svelte 4）の組み合わせで、素の npm ci では入らないため
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run check
